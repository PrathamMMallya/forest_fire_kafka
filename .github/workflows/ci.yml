# CI workflow: lint the Python backend and build the React frontend
# Triggers on PRs and pushes to any branch
name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend — Lint & smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Lint with flake8
        run: |
          python -m pip install flake8
          # Fail CI on style issues
          flake8 .

      - name: Run tests
        run: |
          pytest -q

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/react-app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/react-app/package-lock.json') }}

      - name: Install, test and build
        run: |
          cd frontend/react-app
          npm install
          npm test
          npm run build
