version: '3.8'
services:
  inference:
    build: .
    image: wildfire-inference:latest
    ports:
      - "8000:8000"
    volumes:
      - ./monitoring:/app/monitoring
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/react-app
      args:
        # Baked into the browser JS: must be a browser-reachable path.
        # "http://inference:8000" only resolves inside the compose network and
        # breaks in the browser; nginx proxies /api -> inference:8000 instead.
        VITE_API_URL: "/api"
    image: wildfire-frontend:latest
    ports:
      - "8001:80"
    depends_on:
      - inference
