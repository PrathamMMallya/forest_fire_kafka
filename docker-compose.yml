version: '3.8'
services:
  inference:
    build: .
    image: wildfire-inference:latest
    ports:
      - "8000:8000"
    volumes:
      - ./monitoring:/app/monitoring
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/react-app
      args:
        VITE_API_URL: "http://inference:8000"
    image: wildfire-frontend:latest
    ports:
      - "8001:80"
    depends_on:
      - inference
