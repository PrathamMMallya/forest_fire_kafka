name: wildfire-streaming

services:
  # ---------------------------------------------------------------- Kafka --
  kafka:
    image: apache/kafka:3.9.0
    container_name: wildfire-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # -------------------------------------------------------- Elasticsearch --
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: wildfire-es
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    profiles: ["kibana"]
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: wildfire-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ------------------------------------------------------------ Kafka UI --
  kafka-ui:
    profiles: ["ui"]
    image: provectuslabs/kafka-ui:latest
    container_name: wildfire-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wildfire-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------- full-stack app services ----
  # (enabled with: docker compose --profile app up -d)
  producer:
    profiles: ["app"]
    build: { context: .., dockerfile: deploy/Dockerfile.streaming }
    command: python -m streaming.producer --mode replay --eps 50 --speed 60 --loop
    environment: &appenv
      KAFKA_BOOTSTRAP: kafka:29092
    volumes: &appvol
      - ../artifacts:/app/artifacts:ro
      - ../eda/data:/app/eda/data:ro
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  streams:
    profiles: ["app"]
    build: { context: .., dockerfile: deploy/Dockerfile.streaming }
    command: python -m streaming.streams_app
    environment: *appenv
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  detector:
    profiles: ["app"]
    build: { context: .., dockerfile: deploy/Dockerfile.streaming }
    command: python -m streaming.detector
    environment: *appenv
    volumes: *appvol
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  indexer:
    profiles: ["app"]
    build: { context: .., dockerfile: deploy/Dockerfile.streaming }
    command: python -m streaming.indexer
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ES_URL: http://elasticsearch:9200
    depends_on:
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

  notifier:
    profiles: ["app"]
    build: { context: .., dockerfile: deploy/Dockerfile.streaming }
    command: python -m streaming.notifier
    environment: *appenv
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    profiles: ["app"]
    build: { context: .., dockerfile: deploy/Dockerfile.streaming }
    command: python -m streaming.api
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ES_URL: http://elasticsearch:9200
    ports:
      - "9991:9991"
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped
